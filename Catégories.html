<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>categories</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=Playfair+Display:ital,wght@1,600&display=swap"
        rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg" />
    <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
    <section class="categories section" id="categories">
          <div class="container">
            <div class="section-heading">
              <div><span class="kicker">Explorer</span><h2>Tout ce qu’il vous faut,<br><em>au même endroit.</em></h2></div>
              <a class="arrow-link" href="#annonces">Voir toutes les catégories <svg><use href="#icon-arrow"></use></svg></a>
            </div>
            <div class="category-grid">
              <button class="category-card" data-category="Véhicules"><span class="category-icon sage"><svg><use href="#icon-tractor"></use></svg></span><span class="category-copy"><strong>Tracteurs</strong><small>1 240 annonces</small></span><span class="category-arrow"><svg><use href="#icon-chevron"></use></svg></span></button>
              <button class="category-card" data-category="Matériel agricole"><span class="category-icon wheat"><svg><use href="#icon-package"></use></svg></span><span class="category-copy"><strong>Matériel agricole</strong><small>860 annonces</small></span><span class="category-arrow"><svg><use href="#icon-chevron"></use></svg></span></button>
              <button class="category-card" data-category="Semences"><span class="category-icon mint"><svg><use href="#icon-leaf"></use></svg></span><span class="category-copy"><strong>Semences &amp; plants</strong><small>520 annonces</small></span><span class="category-arrow"><svg><use href="#icon-chevron"></use></svg></span></button>
              <button class="category-card" data-category="Intrants"><span class="category-icon sand"><svg><use href="#icon-sparkles"></use></svg></span><span class="category-copy"><strong>Intrants agricoles</strong><small>430 annonces</small></span><span class="category-arrow"><svg><use href="#icon-chevron"></use></svg></span></button>
              <button class="category-card" data-category="Récoltes &amp; produits"><span class="category-icon peach"><svg><use href="#icon-cart"></use></svg></span><span class="category-copy"><strong>Récoltes &amp; produits</strong><small>970 annonces</small></span><span class="category-arrow"><svg><use href="#icon-chevron"></use></svg></span></button>
              <button class="category-card" data-category="Pièces"><span class="category-icon stone"><svg><use href="#icon-package"></use></svg></span><span class="category-copy"><strong>Pièces détachées</strong><small>310 annonces</small></span><span class="category-arrow"><svg><use href="#icon-chevron"></use></svg></span></button>
            </div>
          </div>
          <div class="center-action">
            <a href="index.html" class="back-home">
                ← Retour à l'accueil
            </a>
        </div>
    </section>
    <script src="assets/js/app.js" defer></script>
        
</body>
</html>
