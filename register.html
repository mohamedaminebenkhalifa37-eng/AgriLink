<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Créer un compte - AgriPlace</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #062d1c, #0d472d);
      color: white;
      padding: 20px;
    }

    .register-container {
      width: 100%;
      max-width: 440px;
      padding: 40px 35px;
      background: #ffffff;
      color: #183b2b;
      border-radius: 20px;
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.25);
    }

    .logo {
      text-align: center;
      font-size: 30px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .logo span {
      color: #b9e64b;
    }

    .subtitle {
      text-align: center;
      color: #718078;
      margin-bottom: 30px;
      font-size: 14px;
    }

    h2 {
      font-size: 26px;
      margin-bottom: 8px;
    }

    .description {
      color: #718078;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #dce5df;
      border-radius: 9px;
      outline: none;
      font-size: 15px;
      transition: 0.3s;
    }

    input:focus {
      border-color: #2b704b;
      box-shadow: 0 0 0 3px rgba(43, 112, 75, 0.12);
    }

    .register-button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 9px;
      background: #17452e;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .register-button:hover {
      background: #246541;
      transform: translateY(-1px);
    }

    .message {
      display: none;
      padding: 10px;
      margin-bottom: 15px;
      border-radius: 8px;
      background: #edf7e8;
      color: #17452e;
      font-size: 13px;
      line-height: 1.5;
    }

    .login,
    .back-home {
      text-align: center;
      font-size: 14px;
    }

    .login {
      margin-top: 25px;
      color: #718078;
    }

    .back-home {
      display: block;
      margin-top: 20px;
      color: #718078;
      font-size: 13px;
    }

    a {
      color: #28734b;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      .register-container {
        padding: 30px 22px;
      }
    }
  </style>
</head>

<body>
  <main class="register-container">
    <div class="logo">Agri<span>Link</span></div>
    <p class="subtitle">La marketplace du monde agricole</p>

    <h2>Créer un compte</h2>
    <p class="description">Rejoignez AgriLink en quelques étapes.</p>

    <div class="message" id="message" role="status" aria-live="polite"></div>

    <form id="registerForm">
      <div class="form-group">
        <label for="name">Nom complet</label>
        <input type="text" id="name" name="name" autocomplete="name" required>
      </div>

      <div class="form-group">
        <label for="email">Adresse e-mail</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="exemple@email.com"
          autocomplete="email"
          required
        >
      </div>

      <div class="form-group">
        <label for="password">Mot de passe (8 caractères minimum)</label>
        <input
          type="password"
          id="password"
          name="password"
          autocomplete="new-password"
          minlength="8"
          required
        >
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirmer le mot de passe</label>
        <input
          type="password"
          id="confirmPassword"
          name="confirmPassword"
          autocomplete="new-password"
          minlength="8"
          required
        >
      </div>

      <button type="submit" class="register-button">Créer mon compte →</button>
    </form>

    <p class="login">
      Vous avez déjà un compte ?
      <a href="se_connecter.html">Se connecter</a>
    </p>

    <a href="index.html" class="back-home">← Retour à l'accueil</a>
  </main>

  <script>
    const form = document.getElementById("registerForm");
    const message = document.getElementById("message");
    const passwordInput = document.getElementById("password");
    const confirmPasswordInput = document.getElementById("confirmPassword");

    confirmPasswordInput.addEventListener("input", function() {
      confirmPasswordInput.setCustomValidity(
        confirmPasswordInput.value === passwordInput.value
          ? ""
          : "Les mots de passe ne correspondent pas."
      );
    });

    passwordInput.addEventListener("input", function() {
      confirmPasswordInput.setCustomValidity(
        confirmPasswordInput.value === passwordInput.value
          ? ""
          : "Les mots de passe ne correspondent pas."
      );
    });

    form.addEventListener("submit", function(event) {
      event.preventDefault();
      message.textContent =
        "Le formulaire est valide, mais aucun compte n'a été créé : un serveur sécurisé doit être configuré pour enregistrer les comptes.";
      message.style.display = "block";
    });
  </script>
</body>
</html>
